# 좁은 스윕: c1 결과(탐색 상한 0.12·gap bonus 0 만 학습됨)를 고정하고 LR 3개만 비교. 워커 3개 (평가와 GPU 를 나눠 쓴다).
metric: custom/success_ema
mode: max
num_samples: 1
max_concurrent: 3
scheduler: none
overrides: [exploration.stages.0.max_std=0.12, gap_jump_bonus=0.0]
space:
  runner.algorithm.learning_rate: {grid: [0.00015, 0.0002, 0.0003]}
