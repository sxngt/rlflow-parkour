# generated from t0-sequential-ppo.json by scripts/sync_rlflow_configs.py — edit the JSON, then re-run.
project: parkour
schema_version: 1
task: a1_t0_sequential_v2
seed: 0
num_envs: 1024
iterations: 800
episode_seconds: 12.0
target_offset_m: 0.06
surface_height_m: 0.0
success_radius_m: 0.025
success_dwell_s: 0.08
runner:
  num_steps_per_env: 24
  save_interval: 100
  empirical_normalization: true
  logger: tensorboard
  policy:
    class_name: ActorCritic
    init_noise_std: 0.35
    actor_hidden_dims:
    - 128
    - 128
    critic_hidden_dims:
    - 128
    - 128
    activation: elu
  algorithm:
    class_name: PPO
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.001
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
sequence:
  foot_order:
  - FR_foot
  - RL_foot
  - FL_foot
  - RR_foot
  forward_step_range_m:
  - 0.04
  - 0.07
  lateral_step_m: 0.01
  settle_seconds: 0.5
  min_lift_clearance_m: 0.035
  lift_target_height_m: 0.055
  lift_confirm_steps: 2
