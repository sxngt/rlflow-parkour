[project]
name = "parkour"
version = "0.2.0"
description = "Prior-map quadruped (Unitree A1) foothold / parkour research — RLflow project (Isaac Sim 4.5 + Isaac Lab 2.1.1)"
requires-python = ">=3.10,<3.11"
# torch·isaacsim·isaaclab·rsl_rl 은 이미지(lab/isaaclab) 의 시스템 site-packages 에서 온다. 여기엔 순수 파이썬 의존만 둔다.
dependencies = [
  "hydra-core>=1.3,<1.4",
  "omegaconf>=2.3,<2.4",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "numpy>=1.26,<2",           # Isaac Sim 4.5 번들 scipy 등이 numpy 1.26 ABI
  "onnx>=1.16",
  "onnxruntime>=1.20,<1.31",
  "lab-logging",
  "ray[tune]>=2.58,<2.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
lab-logging = { git = "https://github.com/sxngt/rl-flow", subdirectory = "lab_logging", rev = "main" }

[tool.uv]
package = false              # src/parkour 는 train.py/scripts 가 sys.path 로 붙인다 (이미지는 --no-install-project)

[tool.ruff]
line-length = 160
target-version = "py310"
exclude = ["scripts", "tests", "src"]   # 연구 코드는 그대로 둔다; 새 RLflow 진입점만 검사

[tool.pytest.ini_options]
testpaths = ["tests"]
