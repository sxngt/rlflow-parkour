# 혼합 지형(terrain_mix) 학습 정책 평가: 목표 맵(100%) + 중간(80%) + 새 geometry seed(일반화). 각 64 episode, 영상.
schema_version: 1
episodes_per_scenario: 64
scenarios:
  - {name: f100, args: ["--curriculum-map", "{\"seed\":1,\"fractions\":1.0}"]}
  - {name: f080, args: ["--curriculum-map", "{\"seed\":1,\"fractions\":0.8}"]}
  - {name: seed2_f100, args: ["--curriculum-map", "{\"seed\":2,\"fractions\":1.0}"]}
gate:
  required: {}
  p_value: 0.05
  effect_size_threshold: 0.8
  min_relative_drop: 0.05
higher_is_better:
  env/success_rate: true
  env/ep_return: true
  env/ep_len: true
  custom/fail_rate: false
  custom/timeout_rate: false
  custom/mean_final_error_m: false
